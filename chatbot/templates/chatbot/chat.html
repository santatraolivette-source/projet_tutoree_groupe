{% extends 'base.html' %}

{% block title %}
  Chatbot
{% endblock %}

{% block content %}
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/chat.css' %}" />
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />

  <div class="chat-page">
    <div class="chat-container">
      <div class="chat-header">
        <div>
          <h1>Votre assistant virtuel</h1>
          <p>Posez votre question et recevez une réponse intelligente.</p>
        </div>
      </div>

      <div id="chatbox" class="chatbox"></div>

      <div class="chat-input">
        <input type="text" id="userInput" placeholder="Posez votre question..." autocomplete="off" />
        <button type="button" onclick="envoyerMessage()" class="send-button"><img src="{% static 'icone/icons8-send-50.png' %}" alt="Envoyer" width="24" height="24" /></button>
      </div>
    </div>
  </div>

  <script>
    // Historique des messages
    let historique = []
    
    async function envoyerMessage() {
      const input = document.getElementById('userInput')
      const chatbox = document.getElementById('chatbox')
      const message = input.value.trim()
    
      if (!message) return
    
      // Afficher message utilisateur
      chatbox.innerHTML += `<div class="message-row user-row"><div class="message user"><p>${message}</p></div></div>`
    
      input.value = ''
      chatbox.scrollTop = chatbox.scrollHeight
    
      // Afficher indicateur de chargement
      chatbox.innerHTML += `<div class="message-row bot-row" id="loading"><div class="message bot"><p>...</p></div></div>`
    
      const response = await fetch("{% url 'chatbot' %}", {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({ message: message })
      })
    
      const data = await response.json()
      document.getElementById('loading').remove()
    
      chatbox.innerHTML += `<div class="message-row bot-row"><div class="message bot"><p>🤖 ${data.response}</p></div></div>`
    
      chatbox.scrollTop = chatbox.scrollHeight
    }
    
    document.getElementById('userInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') envoyerMessage()
    })
    
    async function chargerHistorique() {
      const response = await fetch("{% url 'chargerHistorique' %}")
      const data = await response.json()
      const chatbox = document.getElementById('chatbox')
    
      data.historique.forEach((item) => {
        if (item.role === 'user') {
          chatbox.innerHTML += `<div class="message-row user-row"><div class="message user"><p>${item.message}</p></div></div>`
        } else {
          chatbox.innerHTML += `<div class="message-row bot-row"><div class="message bot"><p>🤖 ${item.message}</p></div></div>`
        }
      })
      chatbox.scrollTop = chatbox.scrollHeight
    }
    
    document.addEventListener('DOMContentLoaded', chargerHistorique)
  </script>
{% endblock %}
